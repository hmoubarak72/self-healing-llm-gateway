[project]
name = "self-healing-llm-gateway"
version = "0.1.0"
description = "Production-grade self-healing multi-provider LLM gateway with distributed circuit breaking, class-aware failover, hedging, and Redis queueing."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "litellm>=1.50.0",
    "redis>=5.1.0",
    "prometheus-client>=0.21.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "fakeredis[lua]>=2.25.0",
    "ruff>=0.6.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
